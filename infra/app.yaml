AWSTemplateFormatVersion: '2010-09-09'
Description: 'Practice 7 - ECS Stack with OIDC and Auto-created ECR'

Parameters:
  ImageTag:
    Type: String
    Description: 'Git Commit SHA for the Docker image'
    Default: 'latest'
  SubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: 'First public subnet'
  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: 'Second public subnet'

Resources:
  # 1. Создаем ECR репозиторий автоматически
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: cad-p7-repo
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire images older than 14 days",
                "selection": {
                  "tagStatus": "any",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # 2. Роль для выполнения задач
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

  # 3. Кластер ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cad-p7-cluster

  # 4. Определение задачи
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cad-p7-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          # Используем динамический адрес созданного репозитория
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ECRRepository}:${ImageTag}'
          PortMappings:
            - ContainerPort: 80

  # 5. Сервис
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref SubnetId1
            - !Ref SubnetId2
          AssignPublicIp: ENABLED