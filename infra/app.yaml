AWSTemplateFormatVersion: '2010-09-09'
Description: 'Practice 7 - Simple ECS Stack with OIDC'

Parameters:
  ImageTag:
    Type: String
    Description: 'Git Commit SHA for the Docker image'
  SubnetId1:
    Type: AWS::EC2::Subnet::Id
  SubnetId2:
    Type: AWS::EC2::Subnet::Id

Resources:
  # 1. Роль для выполнения задач (чтобы ECS мог тянуть образ из ECR)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'

  # 2. Кластер ECS
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cad-p7-cluster

  # 3. Определение задачи (Task Definition)
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cad-p7-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub '278387431573.dkr.ecr.eu-north-1.amazonaws.com/cad-p7-repo:${ImageTag}'
          PortMappings:
            - ContainerPort: 80

  # 4. Сервис (запускает задачу)
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - subnet-033feec45846084e3
            - subnet-08885071cbbb5ea08
          AssignPublicIp: ENABLED