AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Stack for Practice 7

Parameters:
  ImageTag:
    Type: String
    Description: Tag of the Docker image to deploy

Resources:
  # 1. ECS Cluster
  MyCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cad-p7-cluster

  # 2. Task Definition (Описание того, как запускать контейнер)
  MyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cad-p7-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      # Роль для выполнения задачи (должна существовать в аккаунте, обычно создается автоматически при первом использовании ECS)
      ExecutionRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/ecsTaskExecutionRole"
      ContainerDefinitions:
        - Name: web-app
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/cad-p7-repo:${ImageTag}"
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp

  # 3. ECS Service (Запускает задачи)
  MyService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref MyCluster
      TaskDefinition: !Ref MyTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          # ВАЖНО: Здесь мы используем Default VPC. 
          # Тебе нужно будет заменить эти Subnet IDs на свои из Default VPC!
          Subnets:
            - subnet-xxxxxxx1 
            - subnet-xxxxxxx2
          AssignPublicIp: ENABLED